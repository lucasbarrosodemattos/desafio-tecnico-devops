server {
    listen 80;
    listen [::]:80;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}